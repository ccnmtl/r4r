services:
    db:
        container_name: r4r-db
        image: postgres:15
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD", "psql", "-U", "postgres", "r4r"]
            interval: 1s
            timeout: 5s
            retries: 5
    web:
        container_name: r4r
        build: .
        command: >
            sh -c "python manage.py migrate --noinput --settings=r4r.settings_docker &&
                npm ci &&
                trap 'kill 0' EXIT;
                python manage.py runserver --settings=r4r.settings_docker 0.0.0.0:8000 &&
                npm run dev"
        volumes:
            - .:/src
        ports:
            - "8000:8000"
        environment:
            - ENV=dev
            - POSTGRES_DB=r4r
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_HOST=r4r-db
            - POSTGRES_PORT=5432
        depends_on:
            db:
                condition: service_healthy
