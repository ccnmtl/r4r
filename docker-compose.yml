services:
  web:
    container_name: r4r
    build: .
    command: >
      sh -c "python manage.py migrate --noinput --settings=r4r.settings_$ENV &&
             npm ci &&
             trap 'kill 0' EXIT;
             npm run build &&
             python manage.py collectstatic --noinput --settings=r4r.settings_$ENV &&
             python manage.py runserver --settings=r4r.settings_$ENV 0.0.0.0:$PORT"
    volumes:
      - .:/src
      - /var/log/django:/var/log/django
      - ./local_settings.py:/src/r4r/local_settings.py
    ports:
      - "$PORT:$PORT"
    env_file:
      - .env