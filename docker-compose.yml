services:
  web:
    container_name: r4r
    build: .
    command: >
      sh -c "python manage.py migrate --noinput --settings=r4r.settings_$LONGENV &&
             npm ci &&
             trap 'kill 0' EXIT;
             python manage.py runserver --settings=r4r.settings_$LONGENV 0.0.0.0:8000 &&
             npm run dev"
    volumes:
      - .:/src
    ports:
      - "8000:8000"
    env_file:
      - .env