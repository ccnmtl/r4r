services:
  db:
    container_name: r4r-db
    image: postgres:17
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "psql", "-U", $POSTGRES_USER, $POSTGRES_DB]
      interval: 1s
      timeout: 5s
      retries: 5
  web:
    container_name: r4r
    build: .
    command: >
      sh -c "python manage.py migrate --noinput --settings=r4r.settings_$ENV &&
             npm ci &&
             trap 'kill 0' EXIT;
             python manage.py runserver --settings=r4r.settings_$ENV 0.0.0.0:$PORT &&
             npm run dev"
    volumes:
      - .:/src
    ports:
      - "$PORT:$PORT"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy